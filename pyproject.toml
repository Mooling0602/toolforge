[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolforge"
version = "0.4.0"
description = "LLM tool-calling middleware: native FC pass-through or XYML prompt fallback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ToolForge contributors" }]
keywords = ["tool-calling", "function-calling", "llm", "proxy", "openai", "anthropic", "gemini"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0"]

[project.scripts]
toolforge = "app.cli:main"

[project.urls]
Homepage = "https://github.com/YuJunZhiXue/toolforge"
Repository = "https://github.com/YuJunZhiXue/toolforge"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
