server:
  host: "0.0.0.0"
  port: 8080
  timeout_seconds: 180

client_authentication:
  enabled: true
  allowed_keys:
    - "sk-toolforge-demo"

upstreams:
  - name: openai
    type: openai_compat
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"
    models: ["gpt-4o", "gpt-4o-mini"]
    native_fc: true
    is_default: false

  - name: local-openai
    type: openai_compat
    base_url: "http://127.0.0.1:7860/v1"
    api_key: "${LOCAL_API_KEY:-sk-local}"
    models: ["*"]
    native_fc: false
    is_default: true

  - name: anthropic
    type: anthropic
    base_url: "https://api.anthropic.com"
    api_key: "${ANTHROPIC_API_KEY}"
    models: ["claude-sonnet-4-5", "claude-opus-4"]
    native_fc: true
    is_default: false

  - name: gemini
    type: gemini
    base_url: "https://generativelanguage.googleapis.com"
    api_key: "${GEMINI_API_KEY}"
    models: ["gemini-2.5-pro", "gemini-2.5-flash"]
    native_fc: true
    is_default: false

  - name: grok
    type: openai_compat
    base_url: "https://api.x.ai/v1"
    api_key: "${XAI_API_KEY}"
    models: ["grok-3"]
    native_fc: true
    is_default: false

routing:
  aliases: {}

features:
  fc_mode: auto
  enable_streaming: true
  enable_fc_error_retry: true
  fc_error_retry_max: 2
  strip_think_tags: true
  inject_protocol: XYML
  convert_developer_to_system: true
  key_passthrough: false
  model_passthrough: false
  enable_cli_profiles: true
  obfuscate_tool_names: false
  enable_metrics: true
