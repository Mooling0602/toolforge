[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xyml-toolcall"
version = "0.1.0"
description = "XYML tool-call protocol engine (parse/render/sieve) for ToolForge."
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ToolForge contributors" }]
keywords = ["xyml", "tool-calls", "function-calling", "llm"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/YuJunZhiXue/toolforge"
Repository = "https://github.com/YuJunZhiXue/toolforge"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xyml_toolcall = ["py.typed"]
